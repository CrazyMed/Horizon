name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * *'  # Trigger daily at 9:00 UTC to catch new posts

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Build with Jekyll
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: ./docs
      - name: Build site
        run: |
          cd docs
          bundle exec jekyll build --future --destination ../_site
          echo "--- _site contents ---"
          find ../_site -name "*.html" -o -name "*.xml" | head -30
          echo "--- _posts in source ---"
          ls -la _posts/ 2>/dev/null || echo "No _posts dir"
        env:
          JEKYLL_ENV: production
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
