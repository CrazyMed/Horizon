theme: jekyll-theme-cayman
title: Horizon 每日速递
description: AI 驱动的科技与研究资讯每日精选
baseurl: "/Horizon" # the subpath of your site, e.g. /blog
url: "https://crazymed.github.io" # the base hostname & protocol for your site, e.g. http://example.com
repository: "CrazyMed/Horizon"

# Build settings
markdown: kramdown
future: true # Allow future posts to be published
plugins:
  - jekyll-feed
feed:
  path: feed.xml
exclude:
  - ".github"
  - "node_modules"
  - "vendor"

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "default"
